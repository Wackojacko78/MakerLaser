name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Linux system dependencies (Tauri + serialport)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libudev-dev pkg-config build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The committed code has not been through rustfmt yet. Run `cargo fmt --all` once,
      # commit, then delete `continue-on-error` so formatting is enforced.
     # - name: Format check
     #   if: runner.os == 'Linux'
     #   continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # Warnings are reported but do not fail the build yet. Once the first run is clean,
      # add `-- -D warnings`.
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Install (deterministic once package-lock.json is committed)
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run ui:typecheck
      - run: npm run ui:lint
      - run: npm run ui:test
      - run: npm run ui:build
